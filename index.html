<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papo</title>
<meta name="description" content="Chat com IA em tempo real.">
<meta name="theme-color" content="#F3F5FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12131C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233A46FF'/%3E%3Ccircle cx='22' cy='22' r='4' fill='%23FFD23F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F3F5FB;
    --surface: #FFFFFF;
    --ink: #1B1F3B;
    --ink-soft: #5B6182;
    --line: #DCE0EF;
    --bubble: #3A46FF;   /* balão do usuário (texto branco: contraste 6:1) */
    --link: #3A46FF;     /* foco, pontinhos, detalhes */
    --mark: #FFD23F;     /* o ponto amarelo do logo e a seleção de texto */
    --danger: #C7343A;
    --code-bg: #E8EBF8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12131C;
      --surface: #1C1E2B;
      --ink: #ECEEF8;
      --ink-soft: #9AA0C2;
      --line: #2B2E42;
      --bubble: #4B57F5;
      --link: #8E97FF;
      --danger: #FF7A80;
      --code-bg: #23263A;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 1.0625rem/1.55 "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  ::selection { background: var(--mark); color: #1B1F3B; }
  :focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 46rem;
    margin: 0 auto;
  }

  /* ---------- topo ---------- */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(0.75rem + env(safe-area-inset-top, 0px)) 1rem 0.75rem;
  }
  .brand {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.04em;
  }
  .brand::after {
    content: "";
    display: inline-block;
    width: 0.42em;
    height: 0.42em;
    margin-left: 0.08em;
    border-radius: 50%;
    background: var(--mark);
  }
  .ghost {
    font: inherit;
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    cursor: pointer;
  }
  .ghost:hover:not(:disabled) { border-color: var(--ink-soft); }
  .ghost:disabled { opacity: 0.4; cursor: default; }

  /* ---------- conversa ---------- */
  .scroll {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 0.5rem 1rem 1rem;
  }
  .msgs { display: flex; flex-direction: column; gap: 1.5rem; }

  .msg.user { align-self: flex-end; max-width: 85%; }
  .bolha {
    background: var(--bubble);
    color: #FFFFFF;
    padding: 0.6rem 0.95rem;
    border-radius: 1.25rem 1.25rem 0.375rem 1.25rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .msg.bot { max-width: 66ch; }
  .texto { overflow-wrap: anywhere; }
  .texto p { margin: 0 0 0.8em; }
  .texto p:last-child { margin-bottom: 0; }
  .texto ul, .texto ol { margin: 0 0 0.8em; padding-left: 1.3em; }
  .texto li { margin: 0.2em 0; }
  .texto .titulo { font-weight: 800; letter-spacing: -0.01em; }
  .texto code {
    background: var(--code-bg);
    border-radius: 6px;
    padding: 0.1em 0.35em;
    font: 0.9em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .texto pre {
    margin: 0 0 0.8em;
    padding: 0.8rem 0.95rem;
    background: var(--code-bg);
    border-radius: 0.75rem;
    overflow-x: auto;
  }
  .texto pre code {
    padding: 0;
    background: none;
    font-size: 0.875rem;
    line-height: 1.5;
    white-space: pre;
  }
  .fonte { margin-top: 0.4rem; font-size: 0.8125rem; color: var(--ink-soft); }
  .fonte:empty { display: none; }

  .digitando { display: inline-flex; gap: 0.3rem; padding: 0.55rem 0; }
  .digitando i {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: var(--link);
    opacity: 0.3;
    animation: pulso 1.1s infinite ease-in-out;
  }
  .digitando i:nth-child(2) { animation-delay: 0.15s; }
  .digitando i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulso {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .digitando i { animation: none; opacity: 0.6; }
  }

  .erro {
    border-left: 3px solid var(--danger);
    padding: 0.1rem 0 0.1rem 0.85rem;
    max-width: 66ch;
  }
  .erro p { margin: 0 0 0.6rem; }

  /* ---------- tela vazia ---------- */
  .empty { padding: 10vh 0 1rem; }
  .empty[hidden] { display: none; }
  .empty h2 {
    margin: 0 0 1.5rem;
    font-size: clamp(2.4rem, 11vw, 4rem);
    font-weight: 800;
    line-height: 0.98;
    letter-spacing: -0.04em;
  }
  .chips { display: grid; gap: 0.6rem; }
  .chip {
    font: inherit;
    font-size: 1rem;
    text-align: left;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 0.9rem;
    padding: 0.8rem 1rem;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--link); }

  /* ---------- campo de mensagem ---------- */
  .composer {
    display: flex;
    align-items: flex-end;
    gap: 0.5rem;
    padding: 0.5rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
  }
  .composer textarea {
    flex: 1;
    min-width: 0;
    max-height: 10rem;
    resize: none;
    font: inherit;
    font-size: 1rem; /* 16px: evita o zoom automático do iPhone */
    line-height: 1.4;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 1.4rem;
    padding: 0.7rem 1rem;
  }
  .composer textarea::placeholder { color: var(--ink-soft); }
  .composer textarea:focus-visible { outline-offset: 1px; border-color: var(--link); }

  #enviar {
    flex: none;
    display: grid;
    place-items: center;
    width: 2.75rem;
    height: 2.75rem;
    border: 0;
    border-radius: 50%;
    background: var(--bubble);
    color: #FFFFFF;
    cursor: pointer;
  }
  #enviar:disabled { opacity: 0.4; cursor: default; }
  #enviar svg { width: 1.25rem; height: 1.25rem; }
  #enviar.parando .i-enviar { display: none; }
  #enviar:not(.parando) .i-parar { display: none; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand">papo</h1>
    <button id="novo" class="ghost" type="button">Nova conversa</button>
  </header>

  <main id="scroll" class="scroll">
    <div id="msgs" class="msgs" role="log" aria-label="Conversa"></div>
    <section id="vazio" class="empty">
      <h2>Seja bem gordo aqui.</h2>
      <div id="chips" class="chips"></div>
    </section>
  </main>

  <form id="form" class="composer" autocomplete="off">
    <textarea id="input" rows="1" maxlength="4000" placeholder="Escreva sua mensagem" aria-label="Mensagem"></textarea>
    <button id="enviar" type="submit" aria-label="Enviar" disabled>
      <svg class="i-enviar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <svg class="i-parar" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
    </button>
  </form>
</div>

<script>
/* <puras> — funções sem efeito colateral (fáceis de testar) */
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function escapar(s) {
  return s.replace(/[&<>"']/g, (c) => ESC[c]);
}

// Markdown básico: **negrito**, `código`, listas e títulos. Tudo é escapado ANTES de virar HTML.
function inline(t) {
  return escapar(t)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
}

function blocos(texto) {
  let html = '';
  let lista = null;
  let para = [];
  const fecharPara = () => {
    if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; }
  };
  const fecharLista = () => {
    if (lista) { html += '</' + lista + '>'; lista = null; }
  };
  for (const linha of texto.split('\n')) {
    let m;
    if (!linha.trim()) {
      fecharPara(); fecharLista();
    } else if ((m = linha.match(/^\s*[-*•]\s+(.*)$/))) {
      fecharPara();
      if (lista !== 'ul') { fecharLista(); html += '<ul>'; lista = 'ul'; }
      html += '<li>' + inline(m[1]) + '</li>';
    } else if ((m = linha.match(/^\s*\d+[.)]\s+(.*)$/))) {
      fecharPara();
      if (lista !== 'ol') { fecharLista(); html += '<ol>'; lista = 'ol'; }
      html += '<li>' + inline(m[1]) + '</li>';
    } else if ((m = linha.match(/^#{1,6}\s+(.*)$/))) {
      fecharPara(); fecharLista();
      html += '<p class="titulo">' + inline(m[1]) + '</p>';
    } else {
      fecharLista();
      para.push(linha);
    }
  }
  fecharPara(); fecharLista();
  return html;
}

// Separa blocos de código (```), inclusive um bloco ainda aberto durante o streaming.
function renderizar(texto) {
  const re = /```[^\n`]*\n?([\s\S]*?)(?:```|$)/g;
  let saida = '';
  let ultimo = 0;
  let m;
  while ((m = re.exec(texto)) !== null) {
    if (m.index > ultimo) saida += blocos(texto.slice(ultimo, m.index));
    saida += '<pre><code>' + escapar(m[1].replace(/\n$/, '')) + '</code></pre>';
    ultimo = re.lastIndex;
  }
  if (ultimo < texto.length) saida += blocos(texto.slice(ultimo));
  return saida;
}

// Lê o stream (SSE) no formato da OpenAI e devolve os pedaços de texto novos.
function extrairDeltas(buffer) {
  const linhas = buffer.split('\n');
  const resto = linhas.pop(); // última linha pode estar incompleta
  const deltas = [];
  let fim = false;
  for (const l of linhas) {
    const linha = l.trim();
    if (!linha.startsWith('data:')) continue;
    const dado = linha.slice(5).trim();
    if (dado === '[DONE]') { fim = true; continue; }
    try {
      const pedaco = JSON.parse(dado).choices?.[0]?.delta?.content;
      if (typeof pedaco === 'string' && pedaco) deltas.push(pedaco);
    } catch { /* linha que não é JSON: ignora */ }
  }
  return { deltas, resto, fim };
}
/* </puras> */

// ---------- estado ----------
const CHAVE = 'papo:conversa:v1';
const MAX_HISTORICO = 20;
const SUGESTOES = [
  'Explica o que é uma API como se eu tivesse 10 anos',
  'Me ajuda a escrever uma mensagem pedindo aumento',
  'Monta um plano de estudos de 30 dias para aprender inglês',
];

const $ = (id) => document.getElementById(id);
const rolagem = $('scroll'), msgs = $('msgs'), vazio = $('vazio'), form = $('form');
const input = $('input'), botao = $('enviar'), novo = $('novo');

let conversa = carregar();     // [{ role, content, provider? }]
let enviando = false;
let controle = null;           // AbortController da resposta em andamento
let geracao = 0;               // muda ao iniciar "Nova conversa" (descarta respostas antigas)

function carregar() {
  try {
    const dados = JSON.parse(localStorage.getItem(CHAVE) || '[]');
    return Array.isArray(dados)
      ? dados.filter((m) => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string')
      : [];
  } catch { return []; }
}
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(conversa.slice(-60))); } catch { /* sem storage: segue sem salvar */ }
}

// ---------- tela ----------
function pertoDoFim() {
  return rolagem.scrollHeight - rolagem.scrollTop - rolagem.clientHeight < 90;
}
function rolarFim() {
  rolagem.scrollTop = rolagem.scrollHeight;
}

function pintarBot(el, m) {
  el.querySelector('.texto').innerHTML = m.content
    ? renderizar(m.content)
    : '<span class="digitando" role="status" aria-label="Escrevendo"><i></i><i></i><i></i></span>';
  el.querySelector('.fonte').textContent = m.provider && m.content ? 'via ' + m.provider : '';
}

function criarMsg(m) {
  const el = document.createElement('article');
  if (m.role === 'user') {
    el.className = 'msg user';
    const b = document.createElement('div');
    b.className = 'bolha';
    b.textContent = m.content;
    el.append(b);
  } else {
    el.className = 'msg bot';
    const t = document.createElement('div');
    t.className = 'texto';
    const f = document.createElement('div');
    f.className = 'fonte';
    el.append(t, f);
    pintarBot(el, m);
  }
  return el;
}

function ajustarCampo() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
}

function atualizarUI() {
  botao.classList.toggle('parando', enviando);
  botao.setAttribute('aria-label', enviando ? 'Parar resposta' : 'Enviar');
  botao.disabled = !enviando && !input.value.trim();
  novo.disabled = !conversa.length && !enviando;
  vazio.hidden = conversa.length > 0 || enviando;
  msgs.setAttribute('aria-busy', String(enviando));
}

function mostrarErro(texto, podeTentar) {
  const el = document.createElement('div');
  el.className = 'erro';
  el.setAttribute('role', 'alert');
  const p = document.createElement('p');
  p.textContent = texto;
  el.append(p);
  if (podeTentar) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ghost';
    b.textContent = 'Tentar de novo';
    b.addEventListener('click', () => { el.remove(); pedirResposta(); });
    el.append(b);
  }
  msgs.append(el);
  rolarFim();
}

// ---------- conversa com o servidor ----------
async function pedirResposta() {
  const minha = ++geracao;
  const resposta = { role: 'assistant', content: '', provider: null };
  const el = criarMsg(resposta);
  msgs.append(el);
  enviando = true;
  controle = new AbortController();
  atualizarUI();
  rolarFim();

  let agendado = false;
  const pintar = () => {
    if (agendado) return;
    agendado = true;
    requestAnimationFrame(() => {
      agendado = false;
      const perto = pertoDoFim();
      pintarBot(el, resposta);
      if (perto) rolarFim();
    });
  };

  let falha = null;
  try {
    const historico = conversa
      .filter((m) => m.content)
      .slice(-MAX_HISTORICO)
      .map(({ role, content }) => ({ role, content }));

    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: historico }),
      signal: controle.signal,
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.erro || 'O servidor respondeu com erro ' + r.status + '.');
    }

    resposta.provider = r.headers.get('X-Provider');
    const leitor = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let terminou = false;
    while (!terminou) {
      const { value, done } = await leitor.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const { deltas, resto, fim } = extrairDeltas(buffer);
      buffer = resto;
      terminou = fim;
      if (deltas.length) { resposta.content += deltas.join(''); pintar(); }
    }
    if (!terminou && buffer.trim()) {
      const ultimo = extrairDeltas(buffer + '\n').deltas;
      if (ultimo.length) { resposta.content += ultimo.join(''); pintar(); }
    }
    if (!resposta.content) throw new Error('A IA não devolveu texto. Tente de novo.');
  } catch (e) {
    if (e.name !== 'AbortError') {
      falha = e instanceof TypeError ? 'Sem conexão com o servidor. Confira sua internet e tente de novo.' : e.message;
    }
  }

  if (minha !== geracao) return; // "Nova conversa" foi clicada: descarta tudo

  pintarBot(el, resposta);
  if (resposta.content) conversa.push(resposta);
  else el.remove();

  enviando = false;
  controle = null;
  salvar();
  atualizarUI();

  if (falha) {
    mostrarErro(
      resposta.content ? 'A conexão caiu no meio da resposta. Envie outra mensagem para continuar.' : falha,
      !resposta.content,
    );
  }
}

async function enviar(texto) {
  texto = texto.trim();
  if (!texto || enviando) return;
  msgs.querySelectorAll('.erro').forEach((e) => e.remove());
  const m = { role: 'user', content: texto };
  conversa.push(m);
  msgs.append(criarMsg(m));
  input.value = '';
  ajustarCampo();
  salvar();
  await pedirResposta();
}

function novaConversa() {
  geracao++;
  controle?.abort();
  controle = null;
  enviando = false;
  conversa = [];
  salvar();
  msgs.replaceChildren();
  atualizarUI();
  input.focus();
}

// ---------- eventos ----------
const toque = window.matchMedia('(pointer: coarse)').matches; // no celular, Enter quebra linha

form.addEventListener('submit', (e) => {
  e.preventDefault();
  if (enviando) { controle?.abort(); return; }
  enviar(input.value);
});
input.addEventListener('input', () => { ajustarCampo(); atualizarUI(); });
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !toque) {
    e.preventDefault();
    form.requestSubmit();
  }
});
novo.addEventListener('click', novaConversa);

for (const s of SUGESTOES) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip';
  b.textContent = s;
  b.addEventListener('click', () => enviar(s));
  $('chips').append(b);
}

msgs.replaceChildren(...conversa.map(criarMsg));
atualizarUI();
rolarFim();
</script>
</body>
</html>
